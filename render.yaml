services:
  # Backend Service
  - type: web
    name: ticketing-backend
    env: node
    plan: standard
    region: oregon

    # Build and Start
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start

    # Health Check
    healthCheckPath: /api/health
    healthCheckInterval: 30
    healthCheckTimeout: 10

    # Port
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

      # Database
      - key: MONGODB_URI
        scope: build,runtime

      # JWT
      - key: JWT_SECRET
        scope: build,runtime
      - key: JWT_REFRESH_SECRET
        scope: build,runtime
      - key: JWT_EXPIRE
        value: 30m
      - key: JWT_REFRESH_EXPIRE
        value: 7d

      # Email
      - key: SMTP_HOST
        scope: build,runtime
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        scope: build,runtime
      - key: SMTP_PASS
        scope: build,runtime
      - key: FROM_EMAIL
        scope: build,runtime
      - key: FROM_NAME
        value: Ticketing System

      # Frontend CORS
      - key: FRONTEND_URL
        scope: build,runtime

      # AWS S3
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        scope: build,runtime
      - key: AWS_SECRET_ACCESS_KEY
        scope: build,runtime
      - key: S3_BUCKET_NAME
        scope: build,runtime
      - key: S3_ACL
        value: private
      - key: S3_FOLDER_PREFIX
        value: prod/tickets/
      - key: PRESIGNED_URL_EXPIRY
        value: 3600

      # File Upload
      - key: UPLOAD_PATH
        value: /tmp/uploads
      - key: MAX_FILE_SIZE
        value: 5242880

      # Socket.io
      - key: SOCKET_CORS_ORIGIN
        scope: build,runtime
      - key: SOCKET_CORS_CREDENTIALS
        value: true

      # Security
      - key: PASSWORD_MIN_LENGTH
        value: 8
      - key: SESSION_TIMEOUT_MINUTES
        value: 30

      # Logging
      - key: LOG_LEVEL
        value: info

  # Frontend Service (Static Site)
  - type: static_site
    name: ticketing-frontend
    plan: free  # Render's free tier for static sites

    # Build
    buildCommand: cd frontend && npm install && npm run build

    # Publish directory
    publishPath: frontend/.next/standalone

    # Environment variables
    envVars:
      - key: NEXT_PUBLIC_API_URL
        scope: build,runtime

  # Alternative: Frontend as Web Service (if you need SSR)
  # Uncomment this if you want Next.js server-side rendering
  # - type: web
  #   name: ticketing-frontend-ssr
  #   env: node
  #   plan: standard
  #   buildCommand: cd frontend && npm install && npm run build
  #   startCommand: cd frontend && npm start
  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       scope: build,runtime
