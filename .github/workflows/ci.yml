name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ BACKEND ============
  backend-lint-build:
    name: Backend - Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/index.js

  # ============ FRONTEND ============
  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present
        continue-on-error: true  # Linting is informational, don't fail build

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  # ============ SECURITY CHECK ============
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high || true

  # ============ DEPLOY TO EC2 ============
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend-lint-build, frontend-build, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to project directory
            echo "Navigating to /var/www/ticketing-system"
            cd /var/www/ticketing-system
            echo "Current Directory: $(pwd)"
            
            # Pull latest changes
            git pull origin main
            
            # Frontend Build
            echo "Building Frontend..."
            echo "Navigating to frontend..."
            cd frontend
            echo "Current Directory (Frontend): $(pwd)"
            npm run build
            cd ..
            echo "Returned to Root: $(pwd)"
            
            # Restart Processes
            echo "Restarting PM2 processes..."
            cd backend
            echo "Current Directory (Backend): $(pwd)"
            pm2 reload ecosystem.config.js --env production
            pm2 save
            
            echo "Deployment Complete!"
